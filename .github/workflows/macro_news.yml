name: Macro News Report

on:
  schedule:
    # 北京时间 8:00 (UTC 0:00)
    - cron: '0 0 * * *'
    # 北京时间 12:00 (UTC 4:00)
    - cron: '0 4 * * *'
    # 北京时间 21:00 (UTC 13:00)
    - cron: '0 13 * * *'
  workflow_dispatch:   # 允许手动触发测试

jobs:
  send-macro-mail:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests feedparser

      - name: 运行宏观新闻脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEND_EMAIL: ${{ secrets.SEND_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVE_EMAIL: ${{ secrets.RECEIVE_EMAIL }}
        run: python macro_news.py
