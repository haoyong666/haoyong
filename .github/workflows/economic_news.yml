name: Economic News Report

on:
  schedule:
    # 北京时间 8:20 (UTC 0:20)
    - cron: '20 0 * * *'
    # 北京时间 19:00 (UTC 11:00)
    - cron: '0 11 * * *'
  workflow_dispatch:   # 允许手动测试

jobs:
  send-economic-mail:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests feedparser

      - name: 运行经济新闻脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEND_EMAIL: ${{ secrets.SEND_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVE_EMAIL: ${{ secrets.RECEIVE_EMAIL }}
        run: python economic_news.py
